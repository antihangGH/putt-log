<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パター">
<title>パター練習ログ</title>
<style>
:root{--bg:#eef2ea;--fg:#1b2a1f;--mute:#5d6b60;--card:#fff;--line:#d5ddd0;--in:#2f7d4f;--l:#c9822b;--r:#3b6ea5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--fg:#e6efe6;--mute:#93a396;--card:#1b261e;--line:#2c3a30;--in:#4fae75;--l:#e0a050;--r:#6a9fd6}}
:root[data-theme="dark"]{--bg:#121a14;--fg:#e6efe6;--mute:#93a396;--card:#1b261e;--line:#2c3a30;--in:#4fae75;--l:#e0a050;--r:#6a9fd6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 14px}
.btns{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px}
.btns button{border:0;border-radius:18px;color:#fff;font-size:22px;font-weight:700;height:120px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.btns button:active{transform:scale(.95)}
.btns small{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:4px}
#bl{background:var(--l)}#bi{background:var(--in)}#br{background:var(--r)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.big{font-size:44px;font-weight:700;line-height:1}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;font-size:13px}
.dots{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left}th{font-weight:500;color:var(--mute);font-size:12px}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px;cursor:pointer}
.seg button.on{background:var(--in);border-color:var(--in);color:#fff}
svg.ch{width:100%;height:auto;display:block}
.rng{display:flex;align-items:center;gap:6px;margin:8px 0}
.rng input{flex:1;min-width:0;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px;font-family:inherit}
.seg.p button{padding:8px 2px;font-size:13px}
.undo{display:block;width:100%;margin-top:10px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px;cursor:pointer;touch-action:manipulation}
.undo:active{transform:scale(.98)}
.tools{display:flex;gap:10px;margin-top:14px}
.tools button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px;cursor:pointer}
</style>
</head>
<body>
<h1>パター練習ログ</h1>
<div class="btns">
  <button id="bl" data-k="L">左<small>ミス</small></button>
  <button id="bi" data-k="I">入った<small>カップイン</small></button>
  <button id="br" data-k="R">右<small>ミス</small></button>
</div>
<button id="undo" class="undo">↩ 1球取り消す</button>

<div class="card">
  <div class="row"><span class="mute">今日の成功率</span><span class="mute" id="todayN"></span></div>
  <div class="big" id="rate">–</div>
  <div class="bar" id="bar"></div>
  <div class="legend"><span id="lL" style="color:var(--l)"></span><span id="lI" style="color:var(--in)"></span><span id="lR" style="color:var(--r)"></span></div>
  <div class="mute" style="margin-top:12px">直近10球(新しい順)</div>
  <div class="dots" id="dots"></div>
</div>

<div class="card">
  <div class="row"><b>期間集計</b><span class="mute" id="allN"></span></div>
  <div class="seg p" id="pre"><button data-p="all" class="on">全期間</button><button data-p="m">今月</button><button data-p="30">直近30日</button><button data-p="7">直近7日</button></div>
  <div class="rng"><input type="date" id="rf" aria-label="開始日"><span class="mute">〜</span><input type="date" id="rt" aria-label="終了日"></div>
  <div id="all" class="legend" style="margin-top:8px"></div>
  <div class="mute" id="tilt" style="margin-top:8px"></div>
  <div class="mute" id="streak" style="margin-top:4px"></div>
</div>

<div class="card">
  <b>推移</b>
  <div class="seg" id="seg"><button data-m="d" class="on">日別</button><button data-m="w">週別</button><button data-m="m">月別</button></div>
  <div class="mute" id="chTitle"></div>
  <div id="chart"></div>
  <table id="days"><thead><tr><th>期間</th><th>球数</th><th>入った</th><th>左</th><th>右</th></tr></thead><tbody></tbody></table>
</div>

<div class="tools">
  <button id="reset">全消去</button>
</div>
<div class="card">
  <b>バックアップ</b>
  <div class="mute" id="bkInfo" style="margin:6px 0 10px"></div>
  <div class="tools" style="margin-top:0">
    <button id="exp">書き出し</button>
    <button id="imp">読み込み</button>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
</div>

<div class="mute" style="text-align:center;margin:18px 0 4px;font-size:12px">バージョン 5</div>
<script>
const KEY="putt-log-v1";
let log=[];
try{log=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){log=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(log))}catch(e){}};
const day=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const cnt=a=>({L:a.filter(x=>x.r==="L").length,I:a.filter(x=>x.r==="I").length,R:a.filter(x=>x.r==="R").length,n:a.length});
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"–";
const COL={L:"var(--l)",I:"var(--in)",R:"var(--r)"},LAB={L:"左",I:"○",R:"右"};
const $=id=>document.getElementById(id);

function render(){
  const today=day(Date.now()),t=cnt(log.filter(x=>day(x.t)===today)),a=cnt(rangeLog());
  $("todayN").textContent=t.n+"球";
  $("rate").textContent=pct(t.I,t.n);
  $("bar").innerHTML=t.n?["L","I","R"].map(k=>`<i style="width:${t[k]/t.n*100}%;background:${COL[k]}"></i>`).join(""):"";
  $("lL").textContent="左 "+t.L+"("+pct(t.L,t.n)+")";
  $("lI").textContent="入 "+t.I;
  $("lR").textContent="右 "+t.R+"("+pct(t.R,t.n)+")";
  $("dots").innerHTML=log.slice(-10).reverse().map(x=>`<span class="dot" style="background:${COL[x.r]}">${LAB[x.r]}</span>`).join("")||'<span class="mute">ボタンを押して記録開始</span>';
  $("allN").textContent=a.n+"球";
  $("all").innerHTML=`<span>入った率 ${pct(a.I,a.n)}</span><span style="color:var(--l)">左 ${pct(a.L,a.n)}</span><span style="color:var(--r)">右 ${pct(a.R,a.n)}</span>`;
  const miss=a.L+a.R;
  $("tilt").textContent=miss<5?"ミスが5球以上たまると傾向を表示します":(a.L>a.R*1.25?"左に外す傾向があります":a.R>a.L*1.25?"右に外す傾向があります":"左右のミスはほぼ均等です");
  drawPeriod();
}
document.querySelectorAll(".btns button").forEach(b=>b.onclick=()=>{
  log.push({r:b.dataset.k,t:Date.now()});save();render();
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
});
$("undo").onclick=()=>{log.pop();save();render()};
$("reset").onclick=()=>{if(confirm("記録をすべて消します。よろしいですか?")){log=[];save();render()}};



var rFrom="",rTo="";
function rangeLog(){return log.filter(x=>{const d=day(x.t);return (!rFrom||d>=rFrom)&&(!rTo||d<=rTo)})}
function setRange(f,t,p){
  rFrom=f;rTo=t;$("rf").value=f;$("rt").value=t;
  document.querySelectorAll("#pre button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  render();
}
document.querySelectorAll("#pre button").forEach(b=>b.onclick=()=>{
  const n=new Date(),td=day(n.getTime()),p=b.dataset.p;
  if(p==="all")setRange("","","all");
  else if(p==="m")setRange(day(new Date(n.getFullYear(),n.getMonth(),1).getTime()),td,"m");
  else setRange(day(new Date(n.getFullYear(),n.getMonth(),n.getDate()-(+p-1)).getTime()),td,p);
});
$("rf").onchange=()=>setRange($("rf").value,rTo,"");
$("rt").onchange=()=>setRange(rFrom,$("rt").value,"");
var mode="d";
const pad2=n=>String(n).padStart(2,"0");
function keyOf(t){
  const d=new Date(t);
  if(mode==="m")return d.getFullYear()+"-"+pad2(d.getMonth()+1);
  if(mode==="w"){const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));return day(m.getTime())}
  return day(t);
}
function labelOf(k){
  if(mode==="m")return k.slice(0,4)+"/"+k.slice(5);
  const l=k.slice(5).replace("-","/");return mode==="w"?l+"〜":l;
}
function drawPeriod(){
  const g={};log.forEach(x=>(g[keyOf(x.t)]=g[keyOf(x.t)]||[]).push(x));
  const lim=mode==="d"?14:12,keys=Object.keys(g).sort().slice(-lim);
  const rows=keys.map(k=>({k,c:cnt(g[k])}));
  $("chTitle").textContent="入った率の推移(直近"+rows.length+(mode==="d"?"日":mode==="w"?"週":"か月")+")";
  const W=320,H=140,L=30,R=10,T=10,B=22,iw=W-L-R,ih=H-T-B;
  const X=i=>L+(rows.length<2?iw/2:i*iw/(rows.length-1)),Y=v=>T+ih*(1-v);
  let sv=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="入った率の推移">`;
  [0,.5,1].forEach(v=>{sv+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${L-4}" y="${Y(v)+4}" text-anchor="end" font-size="10" style="fill:var(--mute)">${v*100}%</text>`});
  if(rows.length){
    const pts=rows.map((r,i)=>[X(i),Y(r.c.n?r.c.I/r.c.n:0)]);
    if(pts.length>1)sv+=`<polyline fill="none" stroke-width="2.5" stroke-linejoin="round" style="stroke:var(--in)" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
    pts.forEach(p=>sv+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" style="fill:var(--in)"/>`);
    const idx=[...new Set([0,Math.floor((rows.length-1)/2),rows.length-1])];
    idx.forEach(i=>sv+=`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0&&rows.length>1?"start":i===rows.length-1&&rows.length>1?"end":"middle"}" font-size="10" style="fill:var(--mute)">${labelOf(rows[i].k)}</text>`);
  }
  $("chart").innerHTML=sv+"</svg>";
  $("days").tBodies[0].innerHTML=rows.slice().reverse().map(r=>`<tr><td>${labelOf(r.k)}</td><td>${r.c.n}</td><td>${r.c.I}(${pct(r.c.I,r.c.n)})</td><td>${r.c.L}</td><td>${r.c.R}</td></tr>`).join("");
}
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b));drawPeriod();
});
function streakInfo(){
  let best=0,run=0;const rl=rangeLog();rl.forEach(x=>{run=x.r==="I"?run+1:0;if(run>best)best=run});
  let cur=0;for(let i=rl.length-1;i>=0&&rl[i].r==="I";i--)cur++;
  $("streak").textContent=rl.length?`連続カップイン 最高 ${best}球 / 現在 ${cur}球`:"";
}
let meta={t:0,n:0};
try{meta=JSON.parse(localStorage.getItem("putt-meta")||"")||meta}catch(e){}
const saveMeta=()=>{try{localStorage.setItem("putt-meta",JSON.stringify(meta))}catch(e){}};
function bkInfo(){
  const since=log.length-meta.n;
  $("bkInfo").textContent=meta.t?`最終バックアップ: ${new Date(meta.t).toLocaleDateString("ja-JP")}(以降 ${Math.max(since,0)}球分は未保存)`:"まだバックアップしていません";
  $("bkInfo").style.color=(!meta.t&&log.length>0)||since>=100?"var(--l)":"var(--mute)";
}
const _render=render;render=function(){_render();bkInfo();streakInfo()};
$("exp").onclick=async()=>{
  const d=new Date(),name="putt-log-"+day(d).replace(/-/g,"")+".json";
  const file=new File([JSON.stringify({v:1,log})],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]})}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
    meta={t:Date.now(),n:log.length};saveMeta();render();
  }catch(e){}
};
$("imp").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const j=JSON.parse(await f.text()),arr=Array.isArray(j)?j:j.log;
    const ok=arr.filter(x=>x&&["L","I","R"].includes(x.r)&&Number.isFinite(x.t));
    if(!ok.length)throw 0;
    const seen=new Set(log.map(x=>x.r+x.t));
    const add=ok.filter(x=>!seen.has(x.r+x.t));
    if(!confirm(`${ok.length}球分のファイルです。現在の記録に${add.length}球分を追加します(重複は無視)。よろしいですか?`))return;
    log=log.concat(add).sort((a,b)=>a.t-b.t);save();render();
  }catch(err){alert("読み込めませんでした。書き出したファイルを選んでください。")}
};
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js")}catch(e){}});
</script>
</body>
</html>
