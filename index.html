<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パター">
<title>パター練習ログ</title>
<style>
:root{--bg:#eef2ea;--fg:#1b2a1f;--mute:#5d6b60;--card:#fff;--line:#d5ddd0;--in:#2f7d4f;--l:#c9822b;--r:#3b6ea5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--fg:#e6efe6;--mute:#93a396;--card:#1b261e;--line:#2c3a30;--in:#4fae75;--l:#e0a050;--r:#6a9fd6}}
:root[data-theme="dark"]{--bg:#121a14;--fg:#e6efe6;--mute:#93a396;--card:#1b261e;--line:#2c3a30;--in:#4fae75;--l:#e0a050;--r:#6a9fd6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 14px}
.btns{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px}
.btns button{border:0;border-radius:18px;color:#fff;font-size:22px;font-weight:700;height:120px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.btns button:active{transform:scale(.95)}
.btns small{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:4px}
#bl{background:var(--l)}#bi{background:var(--in)}#br{background:var(--r)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.big{font-size:44px;font-weight:700;line-height:1}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;font-size:13px}
.dots{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left}th{font-weight:500;color:var(--mute);font-size:12px}
.tools{display:flex;gap:10px;margin-top:14px}
.tools button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px;cursor:pointer}
</style>
</head>
<body>
<h1>パター練習ログ</h1>
<div class="btns">
  <button id="bl" data-k="L">左<small>ミス</small></button>
  <button id="bi" data-k="I">入った<small>カップイン</small></button>
  <button id="br" data-k="R">右<small>ミス</small></button>
</div>

<div class="card">
  <div class="row"><span class="mute">今日の成功率</span><span class="mute" id="todayN"></span></div>
  <div class="big" id="rate">–</div>
  <div class="bar" id="bar"></div>
  <div class="legend"><span id="lL" style="color:var(--l)"></span><span id="lI" style="color:var(--in)"></span><span id="lR" style="color:var(--r)"></span></div>
  <div class="mute" style="margin-top:12px">直近10球(新しい順)</div>
  <div class="dots" id="dots"></div>
</div>

<div class="card">
  <div class="row"><b>通算</b><span class="mute" id="allN"></span></div>
  <div id="all" class="legend" style="margin-top:8px"></div>
  <div class="mute" id="tilt" style="margin-top:8px"></div>
</div>

<div class="card">
  <b>日別</b>
  <table id="days"><thead><tr><th>日付</th><th>球数</th><th>入った</th><th>左</th><th>右</th></tr></thead><tbody></tbody></table>
</div>

<div class="tools">
  <button id="undo">1球取り消す</button>
  <button id="reset">全消去</button>
</div>

<script>
const KEY="putt-log-v1";
let log=[];
try{log=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){log=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(log))}catch(e){}};
const day=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const cnt=a=>({L:a.filter(x=>x.r==="L").length,I:a.filter(x=>x.r==="I").length,R:a.filter(x=>x.r==="R").length,n:a.length});
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"–";
const COL={L:"var(--l)",I:"var(--in)",R:"var(--r)"},LAB={L:"左",I:"○",R:"右"};
const $=id=>document.getElementById(id);

function render(){
  const today=day(Date.now()),t=cnt(log.filter(x=>day(x.t)===today)),a=cnt(log);
  $("todayN").textContent=t.n+"球";
  $("rate").textContent=pct(t.I,t.n);
  $("bar").innerHTML=t.n?["L","I","R"].map(k=>`<i style="width:${t[k]/t.n*100}%;background:${COL[k]}"></i>`).join(""):"";
  $("lL").textContent="左 "+t.L+"("+pct(t.L,t.n)+")";
  $("lI").textContent="入 "+t.I;
  $("lR").textContent="右 "+t.R+"("+pct(t.R,t.n)+")";
  $("dots").innerHTML=log.slice(-10).reverse().map(x=>`<span class="dot" style="background:${COL[x.r]}">${LAB[x.r]}</span>`).join("")||'<span class="mute">ボタンを押して記録開始</span>';
  $("allN").textContent=a.n+"球";
  $("all").innerHTML=`<span>入った率 ${pct(a.I,a.n)}</span><span style="color:var(--l)">左 ${pct(a.L,a.n)}</span><span style="color:var(--r)">右 ${pct(a.R,a.n)}</span>`;
  const miss=a.L+a.R;
  $("tilt").textContent=miss<5?"ミスが5球以上たまると傾向を表示します":(a.L>a.R*1.25?"左に外す傾向があります":a.R>a.L*1.25?"右に外す傾向があります":"左右のミスはほぼ均等です");
  const g={};log.forEach(x=>(g[day(x.t)]=g[day(x.t)]||[]).push(x));
  $("days").tBodies[0].innerHTML=Object.keys(g).sort().reverse().slice(0,14).map(d=>{const c=cnt(g[d]);return`<tr><td>${d.slice(5).replace("-","/")}</td><td>${c.n}</td><td>${c.I}(${pct(c.I,c.n)})</td><td>${c.L}</td><td>${c.R}</td></tr>`}).join("");
}
document.querySelectorAll(".btns button").forEach(b=>b.onclick=()=>{
  log.push({r:b.dataset.k,t:Date.now()});save();render();
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
});
$("undo").onclick=()=>{log.pop();save();render()};
$("reset").onclick=()=>{if(confirm("記録をすべて消します。よろしいですか?")){log=[];save();render()}};
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js")}catch(e){}});
</script>
</body>
</html>
